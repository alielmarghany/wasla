<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wasla | Order Managing App</title>
<link rel="icon" type="image/png" href="Web Head Logo 2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=Space+Mono:wght@400;700&family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --white:#ffffff;
    --red:#ff1a1a;
    --line-on-black: rgba(255,255,255,0.16);
    --line-on-white: rgba(0,0,0,0.14);
    --muted-on-black: rgba(255,255,255,0.62);
    --muted-on-white: rgba(0,0,0,0.6);
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--white);
    color:var(--black);
    font-family:'Space Mono', monospace;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{ background:var(--red); color:var(--white); }

  .display{
    font-family:'Doto', 'Space Mono', monospace;
    font-variation-settings:"wght" 900, "ROND" 1;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:0.01em;
    line-height:0.98;
  }
  html[dir="rtl"] .display{
    font-family:'Cairo','Tajawal',sans-serif;
    font-weight:900;
    letter-spacing:0;
    text-transform:none;
  }
  html[dir="rtl"] body{ font-family:'Tajawal','Cairo',sans-serif; }
  html[dir="rtl"] .mono{ font-family:'Tajawal','Cairo',sans-serif; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{ outline:2px solid var(--red); outline-offset:3px; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px; }
  @media (max-width:640px){ .wrap{ padding:0 20px; } }

  .dot{
    display:inline-block; width:10px; height:10px; background:var(--red); flex:none;
    animation: blink 1.6s steps(1) infinite;
  }
  .dot.small{ width:6px; height:6px; }
  .dot.static{ animation:none; }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0.15;} }

  /* NAV */
  header.nav{
    position:sticky; top:0; z-index:80;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-on-white);
  }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; height:68px; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .wordmark{ font-family:'Doto','Space Mono',monospace; font-weight:900; font-variation-settings:"wght" 900; font-size:22px; letter-spacing:0.02em; }
  .links{ display:flex; gap:30px; font-size:13px; letter-spacing:0.03em; text-transform:uppercase; }
  .links a{ opacity:0.7; transition:opacity .15s; border-bottom:1px solid transparent; padding-bottom:3px; }
  .links a:hover{ opacity:1; border-bottom-color:var(--red); }
  @media (max-width:860px){ .links{ display:none; } }
  .nav-actions{ display:flex; align-items:center; gap:14px; }

  .lang-toggle{
    background:transparent; border:1px solid var(--black); color:var(--black);
    padding:8px 12px; font-size:12px; font-weight:700; letter-spacing:0.06em;
    display:flex; align-items:center; gap:6px;
  }
  .lang-toggle:hover{ background:var(--black); color:var(--white); }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; font-size:13px; font-weight:700; letter-spacing:0.04em;
    text-transform:uppercase; border:1px solid var(--black); background:none;
    transition: background .15s, color .15s, transform .1s;
  }
  .btn-solid{ background:var(--black); color:var(--white); }
  .btn-solid:hover{ background:var(--red); border-color:var(--red); color:var(--white); }
  .btn-outline-white{ border-color:var(--white); color:var(--white); }
  .btn-outline-white:hover{ background:var(--red); border-color:var(--red); }
  .btn:active{ transform:translateY(1px); }
  .btn-sm{ padding:10px 16px; font-size:12px; }

  section{ padding:96px 0; }
  @media (max-width:640px){ section{ padding:64px 0; } }
  .on-black{ background:var(--black); color:var(--white); }
  .on-white{ background:var(--white); color:var(--black); }

  .eyebrow{
    display:flex; align-items:center; gap:9px;
    font-size:12px; letter-spacing:0.12em; text-transform:uppercase; font-weight:700;
    margin:0 0 18px;
  }

  /* HERO */
  .hero{ padding-top:64px; padding-bottom:0; }
  .hero-inner{ max-width:760px; }
  .hero h1{ font-size:clamp(40px,7vw,84px); margin:0 0 26px; }
  .hero .sub{ font-size:16px; line-height:1.75; max-width:560px; opacity:0.82; margin:0 0 34px; }
  .hero-actions{ display:flex; align-items:center; gap:18px; margin-bottom:16px; flex-wrap:wrap; }
  .note{ font-size:12.5px; opacity:0.55; margin:0; }

  .hero-visual{ margin-top:64px; }
  .chat-demo{
    display:flex; align-items:center; gap:0; flex-wrap:wrap;
    border-top:1px solid var(--line-on-white); border-bottom:1px solid var(--line-on-white);
    padding:40px 0;
  }
  .chat-bubble{
    flex:1 1 320px; background:var(--black); color:var(--white);
    padding:20px 22px; font-size:14px; line-height:1.6; position:relative; min-width:260px;
  }
  .chat-bubble::before{
    content:""; position:absolute; top:20px; left:-8px; width:0; height:0;
    border-top:8px solid transparent; border-bottom:8px solid transparent; border-right:8px solid var(--black);
  }
  html[dir="rtl"] .chat-bubble::before{ left:auto; right:-8px; border-right:none; border-left:8px solid var(--black); }
  .chat-arrow{
    flex:0 0 auto; width:64px; display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--red);
  }
  @media (max-width:760px){ .chat-arrow{ width:100%; padding:14px 0; transform:rotate(90deg); } }
  .order-card{
    flex:1 1 320px; border:1px solid var(--black); min-width:260px;
  }
  .order-card-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 18px; border-bottom:1px solid var(--black); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700;
  }
  .order-card-head span.id{ color:var(--red); }
  .order-row{ display:flex; justify-content:space-between; padding:11px 18px; font-size:13px; border-bottom:1px solid var(--line-on-white); }
  .order-row:last-child{ border-bottom:none; }
  .order-row .k{ opacity:0.55; }
  .order-row .v{ font-weight:700; }
  .order-row.status .v{ color:var(--red); }
  .chat-caption{ font-size:12.5px; opacity:0.55; margin:18px 0 0; text-align:center; }

  .stats-strip{ display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line-on-white); }
  @media (max-width:640px){ .stats-strip{ grid-template-columns:1fr; } }
  .stat{ padding:32px 0; border-right:1px solid var(--line-on-white); text-align:center; }
  html[dir="rtl"] .stat{ border-right:none; border-left:1px solid var(--line-on-white); }
  .stat:last-child{ border:none; }
  .stat .num{ font-family:'Doto','Space Mono',monospace; font-weight:900; font-variation-settings:"wght" 900; font-size:36px; }
  html[dir="rtl"] .stat .num{ font-family:'Space Mono',monospace; }
  .stat .lbl{ font-size:11.5px; opacity:0.55; letter-spacing:0.04em; margin-top:6px; }

  /* PROBLEM */
  .problem h2{ font-size:clamp(30px,5vw,52px); max-width:820px; margin:0 0 24px; }
  .problem .body-text{ font-size:15.5px; line-height:1.8; max-width:600px; opacity:0.78; margin:0 0 56px; }
  .cards3{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line-on-white); border:1px solid var(--line-on-white); }
  @media (max-width:760px){ .cards3{ grid-template-columns:1fr; } }
  .card3{ background:var(--white); padding:30px 26px; }
  .card3 .icon{ width:12px; height:12px; background:var(--red); margin-bottom:22px; }
  .card3 h3{ font-size:15px; text-transform:uppercase; letter-spacing:0.03em; margin:0 0 12px; }
  .card3 p{ font-size:13.5px; line-height:1.7; opacity:0.65; margin:0; }

  /* SOLUTION */
  .solution{ position:relative; padding:100px 0; }
  .solution-block{ position:relative; display:inline-block; }
  .solution h2{ font-size:clamp(32px,6vw,64px); margin:0; max-width:820px; }
  .solution .redmark{ background:var(--red); color:var(--white); padding:0 6px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }

  /* PRODUCT */
  .product h2{ font-size:clamp(28px,4.6vw,46px); max-width:760px; margin:0 0 16px; }
  .product .sub-text{ font-size:14.5px; opacity:0.6; max-width:520px; margin:0 0 56px; }
  .modgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line-on-white); border:1px solid var(--line-on-white); }
  @media (max-width:920px){ .modgrid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:520px){ .modgrid{ grid-template-columns:1fr; } }
  .mod{ background:var(--white); padding:26px 22px 30px; }
  .mod .idx{ font-family:'Doto','Space Mono',monospace; font-weight:900; font-variation-settings:"wght" 900; font-size:13px; color:var(--red); margin-bottom:16px; }
  html[dir="rtl"] .mod .idx{ font-family:'Space Mono',monospace; }
  .mod h3{ font-size:15px; text-transform:uppercase; letter-spacing:0.02em; margin:0 0 16px; }
  .mod ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
  .mod li{ font-size:12.5px; opacity:0.65; padding-inline-start:14px; position:relative; line-height:1.5; }
  .mod li::before{ content:""; position:absolute; inset-inline-start:0; top:6px; width:5px; height:5px; background:var(--red); }

  /* PRICING */
  .pricing h2{ font-size:clamp(28px,4.6vw,46px); max-width:760px; margin:0 0 16px; }
  .pricing .sub-text{ font-size:14.5px; opacity:0.6; max-width:520px; margin:0 0 56px; }
  .plans{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line-on-white); border:1px solid var(--line-on-white); }
  @media (max-width:920px){ .plans{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .plans{ grid-template-columns:1fr; } }
  .plan{ background:var(--white); padding:30px 24px; display:flex; flex-direction:column; position:relative; }
  .plan.featured{ background:var(--black); color:var(--white); }
  .plan .badge{ position:absolute; top:0; right:0; background:var(--red); color:var(--white); font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:5px 10px; }
  html[dir="rtl"] .plan .badge{ right:auto; left:0; }
  .plan .pname{ font-size:13px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700; opacity:0.6; margin-bottom:18px; }
  .plan .price{ font-family:'Doto','Space Mono',monospace; font-weight:900; font-variation-settings:"wght" 900; font-size:34px; margin-bottom:2px; }
  html[dir="rtl"] .plan .price{ font-family:'Space Mono',monospace; }
  .plan .price .per{ font-size:12px; opacity:0.55; font-weight:400; }
  .plan .tagline{ font-size:12px; opacity:0.55; margin-bottom:22px; min-height:32px; }
  .plan ul{ list-style:none; margin:0 0 26px; padding:0; display:flex; flex-direction:column; gap:10px; flex:1; }
  .plan li{ font-size:12.5px; padding-inline-start:14px; position:relative; opacity:0.85; line-height:1.5; }
  .plan li::before{ content:"+"; position:absolute; inset-inline-start:0; top:0; color:var(--red); font-weight:700; }
  .plan .btn{ width:100%; justify-content:center; }

  /* HONESTY */
  .honesty h2{ font-size:clamp(26px,4.4vw,44px); max-width:760px; margin:0 0 20px; }
  .honesty p{ font-size:14.5px; line-height:1.8; opacity:0.75; max-width:620px; margin:0; }
  .tag-pill{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line-on-black); padding:7px 14px; font-size:11.5px; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:26px; }

  /* FINAL CTA */
  .finalcta{ text-align:center; }
  .finalcta h2{ font-size:clamp(32px,7vw,72px); margin:0 0 22px; }
  .finalcta p{ font-size:15px; opacity:0.65; margin:0 0 34px; }

  footer{ border-top:1px solid var(--line-on-white); padding:30px 0; font-size:12px; opacity:0.55; text-align:center; }

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.82); z-index:200;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    background:var(--white); width:100%; max-width:560px; max-height:86vh;
    display:flex; flex-direction:column; position:relative; border:1px solid var(--black);
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line-on-white); }
  .modal-head h3{ font-size:13px; text-transform:uppercase; letter-spacing:0.05em; margin:0; }
  .modal-close{ background:none; border:none; font-size:16px; line-height:1; padding:4px; }
  .modal-close:hover{ color:var(--red); }
  .modal-card iframe{ border:none; width:100%; flex:1; min-height:480px; }

  .anchor-offset{ scroll-margin-top:80px; }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <div class="brand">
      <span class="dot"></span>
      <span class="wordmark">WASLA</span>
    </div>
    <nav class="links">
      <a href="#how" data-key="nav.how"></a>
      <a href="#features" data-key="nav.features"></a>
      <a href="#pricing" data-key="nav.pricing"></a>
      <a href="#roadmap" data-key="nav.roadmap"></a>
    </nav>
    <div class="nav-actions">
      <button class="lang-toggle" id="langToggle"><span class="dot small static"></span><span id="langToggleLabel">AR</span></button>
      <button class="btn btn-solid" data-open-modal data-key="nav.cta"></button>
    </div>
  </div>
</header>

<main>

  <section class="hero on-white anchor-offset" id="how">
    <div class="wrap">
      <div class="hero-inner">
        <p class="eyebrow"><span class="dot small"></span><span data-key="hero.eyebrow"></span></p>
        <h1 class="display" id="heroTitle"></h1>
        <p class="sub" data-key="hero.sub"></p>
        <div class="hero-actions">
          <button class="btn btn-solid" data-open-modal data-key="hero.cta"></button>
        </div>
        <p class="note" data-key="hero.note"></p>
      </div>

      <div class="hero-visual">
        <div class="chat-demo">
          <div class="chat-bubble" data-key="chat.msg"></div>
          <div class="chat-arrow">→</div>
          <div class="order-card">
            <div class="order-card-head">
              <span data-key="chat.neworder"></span>
              <span class="id">#WSL-1042</span>
            </div>
            <div class="order-row"><span class="k" data-key="chat.lbl.product"></span><span class="v" data-key="chat.val.product"></span></div>
            <div class="order-row"><span class="k" data-key="chat.lbl.qty"></span><span class="v">2</span></div>
            <div class="order-row"><span class="k" data-key="chat.lbl.customer"></span><span class="v" data-key="chat.val.customer"></span></div>
            <div class="order-row"><span class="k" data-key="chat.lbl.address"></span><span class="v" data-key="chat.val.address"></span></div>
            <div class="order-row status"><span class="k" data-key="chat.lbl.status"></span><span class="v" data-key="chat.val.status"></span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="stats-strip">
      <div class="wrap" style="display:contents;">
        <div class="stat"><div class="num">0–200+</div><div class="lbl" data-key="stats.s1"></div></div>
        <div class="stat"><div class="num">3</div><div class="lbl" data-key="stats.s2"></div></div>
        <div class="stat"><div class="num">EGP</div><div class="lbl" data-key="stats.s3"></div></div>
      </div>
    </div>
  </section>

  <section class="problem on-white">
    <div class="wrap">
      <p class="eyebrow"><span class="dot small"></span><span data-key="problem.eyebrow"></span></p>
      <h2 class="display" data-key="problem.headline"></h2>
      <p class="body-text" data-key="problem.body"></p>

      <div class="cards3">
        <div class="card3">
          <div class="icon"></div>
          <h3 data-key="problem.c1.title"></h3>
          <p data-key="problem.c1.body"></p>
        </div>
        <div class="card3">
          <div class="icon"></div>
          <h3 data-key="problem.c2.title"></h3>
          <p data-key="problem.c2.body"></p>
        </div>
        <div class="card3">
          <div class="icon"></div>
          <h3 data-key="problem.c3.title"></h3>
          <p data-key="problem.c3.body"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="solution on-black">
    <div class="wrap">
      <h2 class="display"><span class="redmark" data-key="solution.title"></span></h2>
    </div>
  </section>

  <section class="product on-white anchor-offset" id="features">
    <div class="wrap">
      <p class="eyebrow"><span class="dot small"></span><span data-key="product.eyebrow"></span></p>
      <h2 class="display" data-key="product.headline"></h2>
      <p class="sub-text" data-key="product.sub"></p>

      <div class="modgrid">
        <div class="mod">
          <div class="idx">01</div>
          <h3 data-key="product.m1.title"></h3>
          <ul>
            <li data-key="product.m1.i1"></li>
            <li data-key="product.m1.i2"></li>
            <li data-key="product.m1.i3"></li>
            <li data-key="product.m1.i4"></li>
          </ul>
        </div>
        <div class="mod">
          <div class="idx">02</div>
          <h3 data-key="product.m2.title"></h3>
          <ul>
            <li data-key="product.m2.i1"></li>
            <li data-key="product.m2.i2"></li>
            <li data-key="product.m2.i3"></li>
            <li data-key="product.m2.i4"></li>
          </ul>
        </div>
        <div class="mod">
          <div class="idx">03</div>
          <h3 data-key="product.m3.title"></h3>
          <ul>
            <li data-key="product.m3.i1"></li>
            <li data-key="product.m3.i2"></li>
            <li data-key="product.m3.i3"></li>
          </ul>
        </div>
        <div class="mod">
          <div class="idx">04</div>
          <h3 data-key="product.m4.title"></h3>
          <ul>
            <li data-key="product.m4.i1"></li>
            <li data-key="product.m4.i2"></li>
            <li data-key="product.m4.i3"></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <section class="pricing on-white anchor-offset" id="pricing">
    <div class="wrap">
      <p class="eyebrow"><span class="dot small"></span><span data-key="pricing.eyebrow"></span></p>
      <h2 class="display" data-key="pricing.headline"></h2>
      <p class="sub-text" data-key="pricing.sub"></p>

      <div class="plans">
        <div class="plan">
          <div class="pname" data-key="plan.free.name"></div>
          <div class="price">0 <span class="en-num">EGP</span></div>
          <div class="tagline" data-key="plan.free.tagline"></div>
          <ul>
            <li data-key="plan.free.f1"></li>
            <li data-key="plan.free.f2"></li>
            <li data-key="plan.free.f3"></li>
            <li data-key="plan.free.f4"></li>
          </ul>
          <button class="btn" data-open-modal data-key="plan.free.cta"></button>
        </div>

        <div class="plan">
          <div class="pname" data-key="plan.starter.name"></div>
          <div class="price">299 <span class="en-num">EGP</span><span class="per">/mo</span></div>
          <div class="tagline" data-key="plan.starter.tagline"></div>
          <ul>
            <li data-key="plan.starter.f1"></li>
            <li data-key="plan.starter.f2"></li>
            <li data-key="plan.starter.f3"></li>
            <li data-key="plan.starter.f4"></li>
          </ul>
          <button class="btn" data-open-modal data-key="plan.starter.cta"></button>
        </div>

        <div class="plan featured">
          <div class="badge" data-key="plan.pro.badge"></div>
          <div class="pname" data-key="plan.pro.name"></div>
          <div class="price">499 <span class="en-num">EGP</span><span class="per">/mo</span></div>
          <div class="tagline" data-key="plan.pro.tagline"></div>
          <ul>
            <li data-key="plan.pro.f1"></li>
            <li data-key="plan.pro.f2"></li>
            <li data-key="plan.pro.f3"></li>
            <li data-key="plan.pro.f4"></li>
          </ul>
          <button class="btn btn-outline-white" data-open-modal data-key="plan.pro.cta"></button>
        </div>

        <div class="plan">
          <div class="pname" data-key="plan.team.name"></div>
          <div class="price">999 <span class="en-num">EGP</span><span class="per">/mo</span></div>
          <div class="tagline" data-key="plan.team.tagline"></div>
          <ul>
            <li data-key="plan.team.f1"></li>

const heroTitleText = {
  en: ["All your orders.", "In one place."],
  ar: ["كل طلباتك", "في مكان واحد."]
};

let currentLang = 'en';

function renderHeroTitle(lang){
  const el = document.getElementById('heroTitle');
  el.innerHTML = '';
  heroTitleText[lang].forEach((line, i) => {
    const span = document.createElement('span');
    span.textContent = line;
    span.style.display = 'block';
    el.appendChild(span);
  });
}

function applyLang(lang){
  currentLang = lang;
  const dict = content[lang];
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(dict[key] !== undefined){ el.textContent = dict[key]; }
  });
  renderHeroTitle(lang);
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.body.classList.toggle('lang-ar', lang === 'ar');
  document.getElementById('langToggleLabel').textContent = lang === 'ar' ? 'EN' : 'AR';
}

document.getElementById('langToggle').addEventListener('click', () => {
  applyLang(currentLang === 'en' ? 'ar' : 'en');
});

applyLang('en');

// Modal
const overlay = document.getElementById('modalOverlay');
const frame = document.getElementById('modalFrame');
document.querySelectorAll('[data-open-modal]').forEach(btn => {
  btn.addEventListener('click', () => {
    frame.src = FORM_URL;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  });
});
function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  frame.src = '';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });
